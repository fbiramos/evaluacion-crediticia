<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreditEval - Motor de Riesgo</title>
    <!-- Tailwind CSS para diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-900 antialiased font-sans">

    <nav class="p-4 custom-nav flex justify-between items-center shadow-sm">
        <div class="flex flex-col justify-center">
            <h1 class="text-xl font-bold brand-logo leading-none">
                <span class="text-accent">Banco</span><span class="text-secondary">Fie</span>
            </h1>
            <span class="text-[11px] font-medium italic text-white mt-1 tracking-wide">por: Delia Alanoca</span>
        </div>
        <div id="nav-actions" class="space-x-2 flex items-center">
            <button onclick="router.navigate('home')" class="text-[10px] bg-gray-700 px-2 py-1 rounded uppercase font-bold">Nueva</button>
            <button onclick="router.navigate('history')" class="text-[10px] bg-gray-700 px-2 py-1 rounded uppercase font-bold">Historial</button>
            <button onclick="router.navigate('settings')" class="p-1 rounded-full hover:bg-gray-200 transition-colors" title="Configuraciones">⚙️</button>
        </div>
    </nav>

    <main id="app-container" class="container mx-auto px-4 py-6">
        <!-- VISTA: Formulario -->
        <section id="view-home" class="view">
            <div class="max-w-4xl mx-auto custom-card p-6 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-semibold mb-6 text-center uppercase">EVALUACIÓN PRELIMINAR</h2>
                <div class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Nombre Completo</label>
                            <input type="text" id="full-name" placeholder="Ej: María López" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Carnet de Identidad</label>
                            <input type="text" id="identity-card" placeholder="Ej: 12345678" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Edad</label>
                            <input type="number" id="client-age" min="18" max="68" placeholder="Ej: 35" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Estado Civil</label>
                            <select id="marital-status" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="Casado">Casado</option>
                                <option value="Conviviente">Conviviente</option>
                                <option value="Soltero">Soltero</option>
                                <option value="Divorciado">Divorciado</option>
                                <option value="Viudo">Viudo</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Estabilidad Domiciliaria</label>
                            <select id="housing-type" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="Propietario">Propietario</option>
                                <option value="Vivienda familiar">Vivienda familiar</option>
                                <option value="Alquilado">Alquilado</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Carga Familiar</label>
                            <select id="dependents" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="0">0</option>
                                <option value="1-2">1-2</option>
                                <option value="3-4">3-4</option>
                                <option value="5 o más">5 o más</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Respaldo Patrimonial</label>
                            <select id="patrimony" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="Inmueble/Vehículo propio">Inmueble/Vehículo propio</option>
                                <option value="Vehículo propio">Vehículo propio</option>
                                <option value="Sin bienes registrados">Sin bienes registrados</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Disponibilidad de Garante</label>
                            <select id="guarantor" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="Garante con ingresos estables">Garante con ingresos estables</option>
                                <option value="Garante con ingresos variables">Garante con ingresos variables</option>
                                <option value="Sin garante">Sin garante</option>
                            </select>
                        </div>
                    </div>

                    <div class="grid md:grid-cols-3 gap-4 pt-4 border-t border-gray-200 dark:border-gray-700">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Historial Crediticio</label>
                            <select id="credit-history" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="Impecable / Sin mora">Impecable / Sin mora</option>
                                <option value="Mora ocasional < 30 días">Mora ocasional &lt; 30 días</option>
                                <option value="Mora severa">Mora severa</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Créditos Vigentes</label>
                            <select id="active-credits" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="Sin créditos activos o 1 al día">Sin créditos activos o 1 al día</option>
                                <option value="2 créditos al día">2 créditos al día</option>
                                <option value="Créditos en mora">Créditos en mora</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Deuda Indirecta / Garante</label>
                            <select id="indirect-debt" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="">Selecciona</option>
                                <option value="No es garante activo">No es garante activo</option>
                                <option value="Garante de crédito al día">Garante de crédito al día</option>
                                <option value="Garante de crédito en mora">Garante de crédito en mora</option>
                            </select>
                        </div>
                    </div>

                    <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
                        <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Antigüedad en la Actividad</label>
                        <select id="business-antiquity" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="">Selecciona</option>
                            <option value="Más de 3 años continuos">Más de 3 años continuos</option>
                            <option value="Aproximadamente 3 años">Aproximadamente 3 años</option>
                            <option value="1-3 años">1-3 años</option>
                            <option value="Menos de 1 año">Menos de 1 año</option>
                        </select>
                    </div>

                    <button id="btn-evaluate" class="w-full btn-primary-custom font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 mt-4">
                        EVALUAR
                    </button>
                </div>

                <div id="result-display" class="mt-6 hidden transition-all duration-300"></div>
            </div>
        </section>

        <!-- VISTA: Configuraciones -->
        <section id="view-settings" class="view hidden">
            <div class="max-w-md mx-auto custom-card p-6 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-semibold mb-6 text-center">Configuraciones</h2>
                
                <div class="space-y-6">
                    <div class="flex items-center justify-between p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
                        <span class="font-medium">Modo Oscuro</span>
                        <button onclick="themeManager.toggle()" id="theme-toggle-btn" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm">Cambiar</button>
                    </div>

                    <div class="pt-4 border-t border-gray-200">
                        <p class="text-[10px] text-muted uppercase font-bold mb-2 tracking-widest">Información de App</p>
                        <p class="text-sm">Versión: <span id="app-version">v8</span></p>
                        <p class="text-sm">Estado: <span class="text-green-500 font-bold">Online</span></p>
                        <button id="btn-sign-out" class="w-full mt-4 bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-lg transition-colors" title="Sign Out">Sign Out</button>
                        <p class="text-xs text-muted mt-4 text-center">© 2024 CreditEval Professional System</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- VISTA: Historial -->
        <section id="view-history" class="view hidden">
            <div class="max-w-4xl mx-auto">
                <h2 class="text-2xl font-semibold mb-4 text-center">Registro de Evaluaciones</h2>

                <div class="mb-4 max-w-lg mx-auto">
                    <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Buscar por nombre o CI</label>
                    <input type="text" id="history-search" placeholder="Ej: María o 12345678" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>

                <div id="history-list" class="space-y-3 max-w-2xl mx-auto">
                    <p class="text-gray-500 text-center italic">No hay registros aún...</p>
                </div>

                <div id="history-detail" class="mt-6 max-w-2xl mx-auto hidden custom-card p-4 rounded-2xl shadow-xl">
                    <h3 class="text-lg font-bold mb-3 uppercase">Detalle de Evaluación</h3>
                    <div id="history-detail-content" class="text-sm space-y-2"></div>
                </div>
            </div>
        </section>
    </main>

    <!-- Firebase Core y Firestore (Versión Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <!-- Cargamos la lógica al final -->
    <script src="app.js?v=8"></script>
    <script>
        // Registro del Service Worker para actualizaciones
        if ('serviceWorker' in navigator) {
            // Escuchar cambios en el controlador para recargar la página
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    // Forzar comprobación de actualización al cargar
                    reg.update();
                });
            });

            // Comprobar actualización cuando el usuario vuelve a la app (ej. cambia de pestaña o desbloquea)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    navigator.serviceWorker.ready.then(reg => reg.update());
                }
            });
        }
    </script>
</body>
</html>
