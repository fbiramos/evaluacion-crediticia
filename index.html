<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CreditEval - Motor de Riesgo</title>
    <!-- Tailwind CSS para diseño rápido -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css?v=8">
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-gray-900 antialiased font-sans">

    <nav class="p-4 custom-nav flex justify-between items-center shadow-sm">
        <h1 class="text-xl font-bold brand-logo">
            <span class="text-accent">Banco</span><span class="text-secondary">Fie</span>
        </h1>
        <div id="nav-actions" class="space-x-2 flex items-center">
            <button onclick="router.navigate('home')" class="text-[10px] bg-gray-700 px-2 py-1 rounded uppercase font-bold">Nueva</button>
            <button onclick="router.navigate('history')" class="text-[10px] bg-gray-700 px-2 py-1 rounded uppercase font-bold">Historial</button>
            <button onclick="router.navigate('settings')" class="p-1 rounded-full hover:bg-gray-200 transition-colors" title="Configuraciones">⚙️</button>
        </div>
    </nav>

    <main id="app-container" class="container mx-auto px-4 py-6">
        <!-- VISTA: Formulario -->
        <section id="view-home" class="view">
            <div class="max-w-md mx-auto custom-card p-6 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-semibold mb-6 text-center">Evaluación Preliminar</h2>
                <div class="space-y-4">
                    <!-- Datos Demográficos y de Actividad -->
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Edad</label>
                            <input type="number" id="client-age" placeholder="Ej: 35" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Estado Civil</label>
                            <select id="marital-status" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                                <option value="Soltero(a)">Soltero(a)</option>
                                <option value="Casado(a)">Casado(a)</option>
                                <option value="Conviviente">Conviviente</option>
                                <option value="Divorciado(a)">Divorciado(a)</option>
                                <option value="Viudo(a)">Viudo(a)</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Antigüedad Negocio (Años)</label>
                        <input type="number" id="business-antiquity" placeholder="Ej: 5" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>

                    <!-- Datos Financieros -->
                    <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Ingresos Totales (Bs)</label>
                                <input type="number" id="total-income" placeholder="Ej: 8000" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                            <div>
                                <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Costos Operativos (Bs)</label>
                                <input type="number" id="operating-costs" placeholder="Ej: 3000" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                            </div>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Gastos Familiares (Bs)</label>
                            <input type="number" id="family-expenses" placeholder="Ej: 2000" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                        <div>
                            <label class="block text-xs text-muted mb-1 uppercase tracking-wider">Cuota Estimada (Bs)</label>
                            <input type="number" id="estimated-payment" placeholder="Ej: 2500" class="w-full custom-input rounded-lg p-3 focus:ring-2 focus:ring-blue-500 outline-none">
                        </div>
                    </div>

                    <!-- Filtro Cualitativo -->
                    <div class="pt-4 border-t border-gray-200 dark:border-gray-700">
                        <label class="flex items-center space-x-3 cursor-pointer">
                            <input type="checkbox" id="judicial-default-declaration" class="h-5 w-5 rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                            <span class="text-sm">¿Cliente declara verbalmente tener mora o procesos judiciales?</span>
                        </label>
                    </div>

                    <div>
                        <!-- Campos opcionales para el futuro, no usados en la lógica actual pero útiles -->
                        <input type="hidden" id="activity-type" value="Comercio">
                        <input type="hidden" id="inventory-assets" value="0">
                        <input type="hidden" id="requested-amount" value="0">
                        <input type="hidden" id="term-months" value="0">
                    </div>

                    <button id="btn-evaluate" class="w-full btn-primary-custom font-bold py-4 rounded-xl shadow-lg transition-all active:scale-95 mt-4">
                        EVALUAR
                    </button>
                </div>

                <!-- Contenedor para el resultado inmediato -->
                <div id="result-display" class="mt-6 hidden transition-all duration-300"></div>
            </div>
        </section>

        <!-- VISTA: Configuraciones -->
        <section id="view-settings" class="view hidden">
            <div class="max-w-md mx-auto custom-card p-6 rounded-2xl shadow-xl">
                <h2 class="text-2xl font-semibold mb-6 text-center">Configuraciones</h2>
                
                <div class="space-y-6">
                    <div class="flex items-center justify-between p-3 bg-gray-100 dark:bg-gray-700 rounded-lg">
                        <span class="font-medium">Modo Oscuro</span>
                        <button onclick="themeManager.toggle()" id="theme-toggle-btn" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm">Cambiar</button>
                    </div>

                    <div class="pt-4 border-t border-gray-200">
                        <p class="text-[10px] text-muted uppercase font-bold mb-2 tracking-widest">Información de App</p>
                        <p class="text-sm">Versión: <span id="app-version">v8</span></p>
                        <p class="text-sm">Estado: <span class="text-green-500 font-bold">Online</span></p>
                        <p class="text-xs text-muted mt-4 text-center">© 2024 CreditEval Professional System</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- VISTA: Historial -->
        <section id="view-history" class="view hidden">
            <h2 class="text-2xl font-semibold mb-4 text-center">Registro de Evaluaciones</h2>
            <div id="history-list" class="space-y-3 max-w-lg mx-auto">
                <p class="text-gray-500 text-center italic">No hay registros aún...</p>
            </div>
        </section>
    </main>

    <!-- Firebase Core y Firestore (Versión Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <!-- Cargamos la lógica al final -->
    <script src="app.js?v=8"></script>
    <script>
        // Registro del Service Worker para actualizaciones
        if ('serviceWorker' in navigator) {
            // Escuchar cambios en el controlador para recargar la página
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
            });

            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').then(reg => {
                    // Forzar comprobación de actualización al cargar
                    reg.update();
                });
            });

            // Comprobar actualización cuando el usuario vuelve a la app (ej. cambia de pestaña o desbloquea)
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    navigator.serviceWorker.ready.then(reg => reg.update());
                }
            });
        }
    </script>
</body>
</html>
